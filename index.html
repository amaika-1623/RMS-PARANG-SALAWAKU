<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena Muria Klok & Radio</title>
    <style>
        :root {
            --bg-color: #0d0b07;
            --card-bg: #14110b;
            --border-gold: #d4af37;
            --text-gold: #e6ca65;
            --text-light: #f4edd3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 2px solid var(--border-gold);
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        header h1 {
            color: var(--text-gold);
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        header p {
            font-size: 0.75rem;
            color: var(--text-light);
            margin: 0 0 15px 0;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .section {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        /* KLOK SECTIE */
        .clock-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-face {
            width: 230px;
            height: 230px;
            position: relative;
            margin: 10px auto;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* VASTE ACHTERGROND AFBEELDING */
        .clock-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .clock-center-dot {
            width: 10px;
            height: 10px;
            background: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* WIJZERS: EXACT GECENTREERD OP HET MIDDELPUNT EN LOPEN OVER DE AS 9-3 */
        .hand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 50% 100%;
            transform: translate(-50%, -100%) rotate(0deg);
            z-index: 5;
        }

        .hour-hand {
            width: 13px;
            height: 62px;
        }

        .minute-hand {
            width: 11px;
            height: 84px;
        }

        .second-hand {
            width: 2px;
            height: 94px;
            background-color: #00ff66;
            z-index: 6;
            transform-origin: 50% 100%;
        }

        .digital-date {
            font-size: 0.9rem;
            color: var(--text-gold);
            margin-top: 5px;
        }

        .digital-time {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        /* KNOPPEN EN INPUTS */
        select, button, input {
            background: linear-gradient(to bottom, #d4af37, #aa8c2c);
            color: #0d0b07;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            margin: 4px 0;
            width: 100%;
            box-sizing: border-box;
        }

        select {
            background: #1f1910;
            color: var(--text-gold);
            border: 1px solid var(--border-gold);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        /* EEUWKALENDER GRID */
        .calendar-header {
            font-size: 0.9rem;
            color: var(--text-gold);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .calendar-day-name {
            color: var(--text-gold);
            font-weight: bold;
            padding: 4px 0;
        }

        .calendar-cell {
            background: rgba(255,255,255,0.05);
            padding: 6px 0;
            border-radius: 3px;
            color: var(--text-light);
        }

        .calendar-cell.empty {
            background: transparent;
        }

        .calendar-cell.today {
            background: var(--border-gold);
            color: #0d0b07;
            font-weight: bold;
        }

        .media-frame {
            display: none;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>MENA MURIA</h1>
        <p>KLOK • RADIO STREAM • EEUWKALENDER</p>
    </header>

    <!-- KLOK SECTIE -->
    <div class="section clock-section">
        <div class="clock-face" id="klokFace">
            <img src="clock-face.png" alt="Klok Wijzerplaat" class="clock-bg-img">
            <div class="clock-center-dot"></div>
            
            <!-- Uurwijzer -->
            <div class="hand hour-hand" id="hourHand">
                <svg viewBox="0 0 20 100" width="100%" height="100%">
                    <path d="M10 0 L19 20 L13 20 L13 100 L7 100 L7 20 L1 20 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
                </svg>
            </div>
            
            <!-- Minuutwijzer -->
            <div class="hand minute-hand" id="minuteHand">
                <svg viewBox="0 0 16 100" width="100%" height="100%">
                    <path d="M8 0 L16 16 L11 16 L11 100 L5 100 L5 16 L0 16 Z" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
                </svg>
            </div>
            
            <!-- Groene Secondewijzer -->
            <div class="hand second-hand" id="secondHand"></div>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-gold); margin-top: 4px; font-weight: bold;">ABORU</div>
        <div class="digital-date" id="digitalDate">woensdag 21 oktober 2026</div>
        <div class="digital-time" id="digitalTime">23:57:18</div>
    </div>

    <!-- DAGELIJKS WOORD -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 4px;">📖 DAGELIJKS WOORD</div>
        <div style="font-size: 0.85rem; font-style: italic;">"De Heer is mijn herder, mij ontbreekt niets."</div>
        <div style="font-size: 0.7rem; opacity: 0.7; margin-top: 4px;">Psalm 23:1</div>
    </div>

    <!-- STREAM & RADIO SPELER -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 6px;">📻 STREAM & RADIO SPELER</div>
        <select id="stationSelect" onchange="kiesStation()">
            <option value="https://www.youtube.com/embed/Q6W78dSEa1M">Carlos Santana (Wekker Concert)</option>
            <option value="https://stream.qmusic.nl/qmusic/aac">Qmusic AAC</option>
            <option value="https://stream.qmusic.nl/qmusic/mp3">Qmusic MP3</option>
        </select>
        <input type="text" id="streamUrl" value="https://www.youtube.com/embed/Q6W78dSEa1M" style="background:#1f1910; color:var(--text-gold); border:1px solid var(--border-gold); font-size:0.75rem; margin-top:6px;">
        <div class="btn-row" style="margin-top: 8px;">
            <button onclick="playMusic()">▶ Play</button>
            <button onclick="stopMusic()" style="background: linear-gradient(to bottom, #d9534f, #c9302c); color: white;">⏹ Stop</button>
        </div>
        <div class="btn-row" style="margin-top: 6px;">
            <button onclick="window.open('https://radio.net', '_blank')">🌍 Radio.net</button>
            <button onclick="window.open('https://www.radio.net/search?q=streaming', '_blank')">📻 Streaming Radios</button>
        </div>
        <div id="playerContainer" class="media-frame">
            <iframe id="youtubePlayer" width="100%" height="180" src="" frameborder="0" allow="autoplay"></iframe>
        </div>
    </div>

    <!-- WEKKER / ALARM -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 6px;">⏰ WEKKER / ALARM</div>
        <div class="btn-row">
            <input type="time" id="alarmTijd" value="07:00" style="text-align: center; background:#1f1910; color:var(--text-gold); border:1px solid var(--border-gold);">
            <button onclick="zetWekker()" style="width: auto; padding: 8px 16px;">Zet Wekker</button>
        </div>
        <div style="font-size: 0.7rem; opacity: 0.7; margin-top: 4px;" id="alarmStatus">Geen wekker ingesteld</div>
    </div>

    <!-- MINI TV & LINKS -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 6px;">📺 MINI TV & FAVORITTEN LIJST</div>
        <div class="btn-row">
            <button onclick="toggleMiniTV()">📺 YouTube TV (Mini)</button>
            <button onclick="window.open('https://youtube.com/@gunungbatuamsterdamlivestreamk?si=bn0MgOYpAdBwtJ2J', '_blank')">⛰️ Gunung Batu</button>
        </div>
        
        <div id="miniTvContainer" class="media-frame">
            <!-- Keuzemenu voor alle Excel favorieten -->
            <select id="miniTvSelect" onchange="kiesExcelNummer()" style="margin-bottom:4px;">
                <select id="miniTvSelect" onchange="kiesExcelNummer()" style="margin-bottom:4px;">
                    <option value="">📂 Kies uit je Excel favorieten...</option>
                </select>
            </select>
            <input type="text" id="miniTvUrl" value="https://youtu.be/WTSLipAWHow" placeholder="Plak YouTube link hier" style="background:#1f1910; color:var(--text-gold); border:1px solid var(--border-gold); font-size:0.75rem; margin-bottom:4px;">
            <div class="btn-row">
                <button onclick="startMiniTV()">Laad & Speel</button>
                <button onclick="toggleMiniTV()" style="background: #d9534f; color:white;">Sluit TV</button>
            </div>
            <!-- Vorige en Volgende knoppen voor de Excel lijst -->
            <div class="btn-row" style="margin-top: 6px;">
                <button onclick="vorigNummer()" style="background: linear-gradient(to bottom, #c9a227, #997512);">⏮ Vorige</button>
                <button onclick="volgendNummer()" style="background: linear-gradient(to bottom, #c9a227, #997512);">Volgende ⏭</button>
            </div>
            <iframe id="miniTvPlayer" width="100%" height="180" src="" frameborder="0" allow="autoplay" style="margin-top:6px;"></iframe>
        </div>
    </div>

    <!-- EEUWKALENDER -->
    <div class="section">
        <div class="calendar-header">📅 EEUWKALENDER</div>
        <button onclick="gaNaarVandaag()">Vandaag</button>
        <div class="btn-row" style="margin-top: 6px;">
            <select id="maandSelect" onchange="bouwKalender()">
                <option value="0">Januari</option>
                <option value="1">Februari</option>
                <option value="2">Maart</option>
                <option value="3">April</option>
                <option value="4">Mei</option>
                <option value="5">Juni</option>
                <option value="6">Juli</option>
                <option value="7">Augustus</option>
                <option value="8">September</option>
                <option value="9" selected>Oktober</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
            <input type="number" id="jaarInput" value="2026" onchange="bouwKalender()" style="width: 80px; text-align: center;">
        </div>
        <button onclick="bouwKalender()" style="margin-top: 6px;">Ga naar jaar / maand</button>
        
        <div class="calendar-grid" id="kalenderGrid"></div>
    </div>
</div>

<script>
    // --- KLOK LOGICA ---
    function updateKlok() {
        const nu = new Date();
        const seconden = nu.getSeconds();
        const minuten = nu.getMinutes();
        const uren = nu.getHours();

        const secGraden = seconden * 6;
        const minGraden = minuten * 6 + seconden * 0.1;
        const uurGraden = (uren % 12) * 30 + minuten * 0.5;

        document.getElementById('secondHand').style.transform = `translate(-50%, -100%) rotate(${secGraden}deg)`;
        document.getElementById('minuteHand').style.transform = `translate(-50%, -100%) rotate(${minGraden}deg)`;
        document.getElementById('hourHand').style.transform = `translate(-50%, -100%) rotate(${uurGraden}deg)`;

        const optiesDagen = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('digitalDate').innerText = nu.toLocaleDateString('nl-NL', optiesDagen);
        document.getElementById('digitalTime').innerText = nu.toLocaleTimeString('nl-NL');
    }
    setInterval(updateKlok, 1000);
    updateKlok();

    // --- JOUW EXCEL PLAYLIST VOOR MINI TV ---
    const miniTvPlaylist = [
        "https://youtu.be/WTSLipAWHow?is=ihYM1OTCED1Zxnda",
        "https://youtu.be/WTSLipAWHow?is=8LtL7ZkeqNaxiJ2e",
        "https://youtu.be/v_sTi3mHYew?is=xB2Zt68-H-_RxU5i",
        "https://youtu.be/4DIH_f5f9i4?is=9KANQlrfIHYgwfon",
        "https://youtu.be/4j9KbjLOEJM?is=7Ui1Kqw_MFNd065A",
        "https://youtu.be/kae_J-tY6B4?is=F6OnrlR43thsLekn",
        "https://youtu.be/DoaRPnAi60Y?is=Wq15cHK8gRvtJCcV",
        "https://music.youtube.com/watch?v=X3BWXepHuPY&si=ImnEXfXYtEATXWg_",
        "https://youtu.be/7DW9pHzwMck?is=ksaHFilCYcgKFQUe",
        "https://youtu.be/09IQ42NwpXE?is=j1GnZG4r7aADzHGf",
        "https://youtu.be/1K3iYEPo_5s?is=CnYGprYlSytmSy_o",
        "https://youtu.be/TEhNMG2du8k?is=hj-weJdWawXLjKKz",
        "https://youtu.be/4q2fdYSf66k?is=dnIkTCgYDnawn7Ou",
        "https://youtu.be/H8szCNO_kWc?is=FUQYqcmElsO5Hbmc",
        "https://youtu.be/Ib88tFArvd0?is=OgAWAs-lgssFyDX4",
        "https://youtu.be/imyCp17uNyk?is=o_NJcNuy4sIb5h4a",
        "https://youtu.be/mgACEylEtAE?is=Mea-1vXmcLtufJ66",
        "https://music.youtube.com/watch?v=d_0khAAItqg&si=oDI1UC7nHq_w2rRX",
        "https://youtu.be/OZNrr3UX9mA?is=MYPdbaUoy15DEZNX",
        "https://youtu.be/K_ajbYkG9fo?is=7K774rqwcGolpD36",
        "https://youtu.be/6mJvUmx56Ko?is=W153_Kp5F4nJo0S2",
        "https://youtu.be/Q6W78dSEa1M?is=45eNcpkPoQmDWDYd",
        "https://youtu.be/aVsaRz2mCU4?is=rSzysZwOHBmPjGIK",
        "https://www.youtube.com/live/9-Plc0og-e8?is=nQNn6Y21_vVIQahQ",
        "https://youtu.be/UffLNP-s2xQ?is=lYiKLZfUVvCs9BUz",
        "https://youtu.be/ZrBxv8VzYuo?is=jkHvc_r5AXHrPLaW",
        "https://music.youtube.com/watch?v=BsJisD7n8_Q&si=Z7Xs_aoKkQXZVKHs",
        "https://youtu.be/d34_LrdH8iI?is=QW30DGrFdfTEd4bh",
        "https://youtu.be/Q6W78dSEa1M?is=8dhGf4027ep-EcJo",
        "https://youtu.be/iab8j-ZqES4?is=TOtO9GIipb-71yb4"
    ];
    let huidigePlaylistIndex = 0;

    // Vul het keuzemenu automatisch met de Excel-nummers
    function vulExcelDropdown() {
        const select = document.getElementById('miniTvSelect');
        miniTvPlaylist.forEach((link, index) => {
            const opt = document.createElement('option');
            opt.value = link;
            opt.text = `Favoriet #${index + 1} (${link.substring(8, 25)}...)`;
            select.appendChild(opt);
        });
    }
    vulExcelDropdown();

    function kiesExcelNummer() {
        const select = document.getElementById('miniTvSelect');
        if (select.value) {
            document.getElementById('miniTvUrl').value = select.value;
            huidigePlaylistIndex = select.selectedIndex - 1;
            startMiniTV();
        }
    }

    function converteerYouTubeLink(url) {
        if (!url) return '';
        // Als het een YouTube Music link is of gewone watch link
        let videoId = '';
        if (url.includes('youtu.be/')) {
            videoId = url.split('youtu.be/')[1].split('?')[0];
        } else if (url.includes('watch?v=')) {
            videoId = url.split('watch?v=').pop().split('&')[0];
        }
        
        if (videoId) {
            return `https://www.youtube.com/embed/${videoId}`;
        }
        return url;
    }

    function volgendNummer() {
        huidigePlaylistIndex = (huidigePlaylistIndex + 1) % miniTvPlaylist.length;
        document.getElementById('miniTvUrl').value = miniTvPlaylist[huidigePlaylistIndex];
        document.getElementById('miniTvSelect').selectedIndex = huidigePlaylistIndex + 1;
        startMiniTV();
    }

    function vorigNummer() {
        huidigePlaylistIndex = (huidigePlaylistIndex - 1 + miniTvPlaylist.length) % miniTvPlaylist.length;
        document.getElementById('miniTvUrl').value = miniTvPlaylist[huidigePlaylistIndex];
        document.getElementById('miniTvSelect').selectedIndex = huidigePlaylistIndex + 1;
        startMiniTV();
    }

    // --- MUZIEK SPELER ---
    function kiesStation() {
        const select = document.getElementById('stationSelect');
        document.getElementById('streamUrl').value = select.value;
    }

    function playMusic() {
        const iframe = document.getElementById('youtubePlayer');
        const container = document.getElementById('playerContainer');
        let urlInput = document.getElementById('streamUrl').value;
        let embedUrl = converteerYouTubeLink(urlInput);
        
        container.style.display = 'block';
        let playUrl = embedUrl.includes('?') ? embedUrl + '&autoplay=1' : embedUrl + '?autoplay=1';
        iframe.src = playUrl;
    }

    function stopMusic() {
        const iframe = document.getElementById('youtubePlayer');
        const container = document.getElementById('playerContainer');
        iframe.src = "";
        container.style.display = 'none';
    }

    // --- MINI TV LOGICA ---
    function toggleMiniTV() {
        const container = document.getElementById('miniTvContainer');
        if (container.style.display === 'block') {
            container.style.display = 'none';
            document.getElementById('miniTvPlayer').src = "";
        } else {
            container.style.display = 'block';
            document.getElementById('miniTvUrl').value = miniTvPlaylist[huidigePlaylistIndex];
            document.getElementById('miniTvSelect').selectedIndex = huidigePlaylistIndex + 1;
            startMiniTV();
        }
    }

    function startMiniTV() {
        const iframe = document.getElementById('miniTvPlayer');
        let urlInput = document.getElementById('miniTvUrl').value;
        let embedUrl = converteerYouTubeLink(urlInput);
        
        let playUrl = embedUrl.includes('?') ? embedUrl + '&autoplay=1' : embedUrl + '?autoplay=1';
        iframe.src = playUrl;
    }

    // --- WEKKER FUNCTIE ---
    function zetWekker() {
        const tijd = document.getElementById('alarmTijd').value;
        if(tijd) {
            document.getElementById('alarmStatus').innerText = `Wekker ingesteld om ${tijd} uur`;
        } else {
            document.getElementById('alarmStatus').innerText = `Geen wekker ingesteld`;
        }
    }

    // --- VOLLEDIGE EEUWKALENDER ---
    function bouwKalender() {
        const maand = parseInt(document.getElementById('maandSelect').value);
        const jaar = parseInt(document.getElementById('jaarInput').value);
        const grid = document.getElementById('kalenderGrid');
        grid.innerHTML = '';

        const dNamen = ['Ma', 'Di', 'Wo', 'Do', 'Vr', 'Za', 'Zo'];
        dNamen.forEach(d => {
            const div = document.createElement('div');
            div.className = 'calendar-day-name';
            div.innerText = d;
            grid.appendChild(div);
        });

        let eersteDagIndex = new Date(jaar, maand, 1).getDay();
        eersteDagIndex = (eersteDagIndex === 0) ? 6 : eersteDagIndex - 1;

        const aantalDagen = new Date(jaar, maand + 1, 0).getDate();

        for (let i = 0; i < eersteDagIndex; i++) {
            const leeg = document.createElement('div');
            leeg.className = 'calendar-cell empty';
            grid.appendChild(leeg);
        }

        const vandaag = new Date();
        for (let dag = 1; dag <= aantalDagen; dag++) {
            const cel = document.createElement('div');
            cel.className = 'calendar-cell';
            cel.innerText = dag;

            if (dag === vandaag.getDate() && maand === vandaag.getMonth() && jaar === vandaag.getFullYear()) {
                cel.classList.add('today');
            }
            grid.appendChild(cel);
        }
    }

    function gaNaarVandaag() {
        const vandaag = new Date();
        document.getElementById('maandSelect').value = vandaag.getMonth();
        document.getElementById('jaarInput').value = vandaag.getFullYear();
        bouwKalender();
    }

    bouwKalender();
</script>

</body>
</html>
