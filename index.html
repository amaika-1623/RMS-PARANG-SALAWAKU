<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json?v=10">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena Muria Klok & Eeuwkalender</title>
    <style>
        body {
            background-color: #0b0804;
            color: #d4af37;
            font-family: 'Times New Roman', serif, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 15px;
            background: #110d06;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        h1 {
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #f3e5ab;
        }
        .subtitle {
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #c5a059;
        }
        .section-box {
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            background: #0f0a05;
        }
        .section-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* RONDE KLOK - Perfect gecentreerd */
        .clock-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 10px auto;
            border-radius: 50%;
            overflow: hidden;
            background-image: url('clock-face.png?v=10');
            background-size: cover;
            background-position: center 47%;
            background-repeat: no-repeat;
            border: none;
            box-shadow: none;
        }

        /* ABORU TEKST ONDER DE KLOK */
        .aboru-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #f3e5ab;
            margin-top: 8px;
            margin-bottom: 4px;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        /* STIJLEMENTEN VOOR DE KROONPIJL-WIJZERS */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            z-index: 10;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.9));
        }
        
        /* UURWIJZER: Sierlijke kroonpijl vorm */
        .hour-hand { 
            width: 12px; 
            height: 65px; 
            background: linear-gradient(135deg, #fff3cd 0%, #d4af37 50%, #aa820a 100%); 
            margin-left: -6px; 
            clip-path: polygon(50% 0%, 80% 15%, 100% 30%, 75% 45%, 70% 100%, 30% 100%, 25% 45%, 0% 30%, 20% 15%);
        }
        
        /* MINUUTWIJZER: Langere kroonpijl vorm */
        .minute-hand { 
            width: 9px; 
            height: 98px; 
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #8b6914 100%); 
            margin-left: -4.5px; 
            clip-path: polygon(50% 0%, 75% 10%, 100% 22%, 70% 35%, 70% 100%, 30% 100%, 30% 35%, 0% 22%, 25% 10%);
        }
        
        /* SECONDEWIJZER: Strak en helder groen */
        .second-hand { 
            width: 1.5px; 
            height: 108px; 
            background: #2ecc71; 
            margin-left: -0.75px; 
            z-index: 11; 
        }
        
        .center-dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            background: radial-gradient(circle, #ffcc00 0%, #8b0000 100%);
            border: 2px solid #d4af37;
            border-radius: 50%;
            margin: -6px 0 0 -6px;
            z-index: 12;
        }

        /* DIGITALE TIJD & DATUM */
        .digital-time-section {
            margin-top: 8px;
            padding: 5px;
            border-top: 1px dashed rgba(212, 175, 55, 0.3);
        }
        .date-line {
            font-size: 13px;
            color: #c5a059;
            margin-bottom: 4px;
            margin-top: 5px;
        }
        .time-line {
            font-size: 28px;
            font-weight: bold;
            color: #f3e5ab;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* BIJBELTEKST */
        .bible-verse {
            font-style: italic;
            font-size: 13px;
            color: #f3e5ab;
            line-height: 1.4;
            padding: 8px 5px;
            min-height: 40px;
        }
        .bible-ref {
            font-size: 11px;
            font-weight: bold;
            color: #d4af37;
            margin-top: 4px;
            font-style: normal;
        }

        /* UI ELEMENTS */
        select, input[type="text"], input[type="number"], input[type="time"], button, .link-button {
            background-color: #1a1205;
            color: #f3e5ab;
            border: 1px solid #d4af37;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            margin: 4px 0;
            box-sizing: border-box;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        select, input[type="text"], input[type="time"] { width: 100%; }
        button, .link-button {
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(to bottom, #d4af37, #aa820a);
            color: #0b0804;
        }
        button:hover, .link-button:hover { opacity: 0.9; }

        iframe {
            border-radius: 6px;
            border: 1px solid #d4af37;
            width: 100%;
            height: 200px;
        }
        .status-text {
            font-size: 11px;
            font-style: italic;
            margin-top: 5px;
            color: #c5a059;
        }
        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
            font-size: 12px;
            text-align: center;
        }
        th { color: #f3e5ab; }
        td.today-cell {
            background: #d4af37;
            color: #0b0804;
            font-weight: bold;
            border-radius: 50%;
        }

        #tvPlayerContainer {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MENA MURIA</h1>
    <div class="subtitle">KLOK • RADIO STREAM • EEUWKALENDER</div>

    <!-- KLOK & DIGITALE TIJD -->

        <div class="clock-container">
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            <div class="center-dot"></div>
        </div>

        <div class="aboru-title">ABORU</div>

        <div
