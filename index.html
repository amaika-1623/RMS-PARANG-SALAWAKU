<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena Muria Klok & Radio</title>
    <style>
        :root {
            --bg-color: #0d0b07;
            --card-bg: #14110b;
            --border-gold: #d4af37;
            --text-gold: #e6ca65;
            --text-light: #f4edd3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 2px solid var(--border-gold);
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        header h1 {
            color: var(--text-gold);
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        header p {
            font-size: 0.75rem;
            color: var(--text-light);
            margin: 0 0 15px 0;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .section {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        /* KLOK SECTIE */
        .clock-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-face {
            width: 280px;
            height: 280px;
            position: relative;
            margin: 10px auto;
            border-radius: 50%;
            overflow: hidden;
            background-image: url('clock-face.png?v=9');
            background-size: cover;
            background-position: center 36.25%;
            background-repeat: no-repeat;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
        }

        .clock-center-dot {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #ffcc00 0%, #8b0000 100%);
            border: 2px solid var(--border-gold);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 12;
        }

        /* WIJZERS */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            z-index: 10;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.9));
        }

        .hour-hand {
            width: 10px;
            height: 62px;
            background: linear-gradient(135deg, #fff3cd 0%, #d4af37 50%, #aa820a 100%);
            margin-left: -5px;
            clip-path: polygon(50% 0%, 100% 25%, 70% 100%, 30% 100%, 0% 25%);
        }

        .minute-hand {
            width: 7px;
            height: 98px;
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #8b6914 100%);
            margin-left: -3.5px;
            clip-path: polygon(50% 0%, 100% 20%, 75% 100%, 25% 100%, 0% 20%);
        }

        .second-hand {
            width: 1.5px;
            height: 108px;
            background: #00ff66;
            margin-left: -0.75px;
            z-index: 11;
            transform-origin: bottom center;
        }

        .digital-date {
            font-size: 0.9rem;
            color: var(--text-gold);
            margin-top: 5px;
        }

        .digital-time {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        /* KNOPPEN EN INPUTS */
        select, button, input, textarea {
            background: linear-gradient(to bottom, #d4af37, #aa8c2c);
            color: #0d0b07;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            margin: 4px 0;
            width: 100%;
            box-sizing: border-box;
        }

        select, textarea {
            background: #1f1910;
            color: var(--text-gold);
            border: 1px solid var(--border-gold);
        }

        textarea {
            resize: vertical;
            font-family: monospace;
            font-size: 0.75rem;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        /* EEUWKALENDER GRID */
        .calendar-header {
            font-size: 0.9rem;
            color: var(--text-gold);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .calendar-day-name {
            color: var(--text-gold);
            font-weight: bold;
            padding: 4px 0;
        }

        .calendar-cell {
            background: rgba(255,255,255,0.05);
            padding: 6px 0;
            border-radius: 3px;
            color: var(--text-light);
            cursor: pointer;
            position: relative;
            min-height: 28px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .calendar-cell:hover {
            background: rgba(212, 175, 55, 0.3);
        }

        .calendar-cell.selected {
            border: 2px solid #ffffff;
        }

        .calendar-cell.empty {
            background: transparent;
            cursor: default;
        }

        .calendar-cell.today {
            background: var(--border-gold);
            color: #0d0b07;
            font-weight: bold;
        }

        .calendar-cell.has-note {
            border: 1px dashed var(--text-gold);
        }

        .media-frame {
            display: none;
            margin-top: 8px;
        }

        #kalenderMelding {
            white-space: pre-line;
            text-align: left;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>MENA MURIA</h1>
        <p>KLOK • RADIO STREAM • EEUWKALENDER</p>
    </header>

    <!-- KLOK SECTIE -->
    <div class="section clock-section">
        <div class="clock-face" id="klokFace">
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            <div class="clock-center-dot"></div>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-gold); margin-top: 4px; font-weight: bold;">ABORU</div>
        <div class="digital-date" id="digitalDate">Laden...</div>
        <div class="digital-time" id="digitalTime">00:00:00</div>
    </div>

    <!-- DAGELIJKS WOORD -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 4px;">📖 DAGELIJKS WOORD</div>
        <div style="font-size: 0.85rem; font-style: italic;" id="bibleVerseText">Laden...</div>
        <div style="font-size: 0.7rem; opacity: 0.7; margin-top: 4px;" id="bibleVerseRef">Laden...</div>
    </div>

    <!-- STREAM & RADIO SPELER -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 6px;">📻 STREAM & RADIO SPELER</div>
        <select id="stationSelect" onchange="kiesStation()">
            <option value="https://www.youtube.com/embed/Q6W78dSEa1M">Carlos Santana (Wekker Concert)</option>
            <option value="https://stream.qmusic.nl/qmusic/aac">Qmusic AAC</option>
            <option value="https://stream.qmusic.nl/qmusic/mp3">Qmusic MP3</option>
        </select>
        <input type="text" id="streamUrl" value="https://www.youtube.com/embed/Q6W78dSEa1M" style="background:#1f1910; color:var(--text-gold); border:1px solid var(--border-gold); font-size:0.75rem; margin-top:6px;">
        <div class="btn-row" style="margin-top: 8px;">
            <button onclick="playMusic()">▶ Play</button>
            <button onclick="stopMusic()" style="background: linear-gradient(to bottom, #d9534f, #c9302c); color: white;">⏹ Stop</button>
        </div>
        <div class="btn-row" style="margin-top: 6px;">
            <button onclick="window.open('https://radio.net', '_blank')">🌍 Radio.net</button>
            <button onclick="window.open('https://www.radio.net/search?q=streaming', '_blank')">📻 Streaming Radios</button>
        </div>
        <div id="playerContainer" class="media-frame">
            <iframe id="youtubePlayer" width="100%" height="180" src="" frameborder="0" allow="autoplay"></iframe>
        </div>
    </div>

    <!-- WEKKER / ALARM -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 6px;">⏰ WEKKER / ALARM</div>
        <div class="btn-row">
            <input type="time" id="alarmTijd" value="07:00" style="text-align: center; background:#1f1910; color:var(--text-gold); border:1px solid var(--border-gold);">
            <button onclick="zetWekker()" style="width: auto; padding: 8px 16px;">Zet Wekker</button>
        </div>
        <div style="font-size: 0.7rem; opacity: 0.7; margin-top: 4px;" id="alarmStatus">Geen wekker ingesteld</div>
    </div>

    <!-- MINI TV & EXCEL IMPORT -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 6px;">📺 MINI TV & EXCEL LIJST IMPORTEREN</div>
        <div class="btn-row">
            <button onclick="toggleMiniTV()">📺 YouTube TV (Mini)</button>
            <button onclick="window.open('https://youtube.com/@gunungbatuamsterdamlivestreamk?si=bn0MgOYpAdBwtJ2J', '_blank')">⛰️ Gunung Batu</button>
        </div>
        <div class="btn-row" style="margin-top: 4px;">
            <button onclick="window.open('https://onedrive.live.com', '_blank')" style="background: linear-gradient(to bottom, #0078d4, #005a9e); color: white;">☁️ OneDrive Muziek</button>
            <button onclick="window.open('https://www.facebook.com', '_blank')">📘 Facebook</button>
        </div>
        
        <div style="margin-top: 8px; text-align: left;">
            <label style="font-size: 0.7rem; color: var(--text-gold);">📥 Plak hieronder je Excel kopie of YouTube links:</label>
            <textarea id="excelInput" rows="3" placeholder="Plak hier je complete Excel lijst of linkjes..."></textarea>
            <button onclick="importeerExcelLijst()" style="background: linear-gradient(to bottom, #28a745, #1e7e34); color: white; margin-top: 4px;">💾 Sla Lijst Op in Geheugen</button>
        </div>

        <div id="miniTvContainer" class="media-frame">
            <select id="miniTvSelect" onchange="kiesExcelNummer()" style="margin-bottom:4px;">
                <option value="">📂 Kies uit je geladen favorieten...</option>
            </select>
            <input type="text" id="miniTvUrl" value="https://youtu.be/WTSLipAWHow" placeholder="YouTube link" style="background:#1f1910; color:var(--text-gold); border:1px solid var(--border-gold); font-size:0.75rem; margin-bottom:4px;">
            <div class="btn-row">
                <button onclick="startMiniTV()">Laad & Speel</button>
                <button onclick="toggleMiniTV()" style="background: #d9534f; color:white;">Sluit TV</button>
            </div>
            <div class="btn-row" style="margin-top: 6px;">
                <button onclick="vorigNummer()" style="background: linear-gradient(to bottom, #c9a227, #997512);">⏮ Vorige</button>
                <button onclick="volgendNummer()" style="background: linear-gradient(to bottom, #c9a227, #997512);">Volgende ⏭</button>
            </div>
            <div id="mediaPlayerWrapper" style="margin-top:6px;">
                <iframe id="miniTvPlayer" width="100%" height="180" src="" frameborder="0" allow="autoplay" style="display:block;"></iframe>
                <video id="miniTvVideo" width="100%" height="180" controls autoplay style="display:none; background:#000;"></video>
            </div>
        </div>
    </div>

    <!-- EEUWKALENDER MET VASTe INVOERBOX -->
    <div class="section">
        <div class="calendar-header">📅 EEUWKALENDER & NOTITIES</div>
        <button onclick="gaNaarVandaag()">Vandaag</button>
        <div class="btn-row" style="margin-top: 6px;">
            <select id="maandSelect" onchange="bouwKalender()">
                <option value="0">Januari</option>
                <option value="1">Februari</option>
                <option value="2">Maart</option>
                <option value="3">April</option>
                <option value="4">Mei</option>
                <option value="5">Juni</option>
                <option value="6">Juli</option>
                <option value="7">Augustus</option>
                <option value="8">September</option>
                <option value="9">Oktober</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
            <input type="number" id="jaarInput" value="2026" onchange="bouwKalender()" style="width: 80px; text-align: center;">
        </div>
        <button onclick="bouwKalender()" style="margin-top: 6px;">Ga naar jaar / maand</button>
        
        <div class="calendar-grid" id="kalenderGrid"></div>

        <!-- VASTE NOTITIE INVOER VELD -->
        <div id="notitieSectie" style="margin-top: 12px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 6px; border: 1px solid var(--border-gold); text-align: left;">
            <div id="geselecteerdeDatumTitel" style="font-size: 0.8rem; color: var(--text-gold); font-weight: bold; margin-bottom: 4px;">Tik op een dag hierboven om notitie te bewerken:</div>
            <textarea id="dagNotitieInput" rows="3" placeholder="Typ hier je verjaardag of afspraak (je kunt gewoon op enter drukken voor nieuwe regels)..." style="width:100%; box-sizing:border-box;"></textarea>
            <button onclick="slaDagNotitieOp()" style="background: linear-gradient(to bottom, #28a745, #1e7e34); color: white; margin-top: 4px;">💾 Bewaar Notitie voor deze dag</button>
        </div>

        <div id="kalenderMelding" style="font-size: 0.75rem; color: var(--text-gold); margin-top: 10px; font-style: italic;"></div>
    </div>
</div>

<script>
    // --- DAGELIJKKS WOORD LOGICA ---
    const bijbelVerzen = [
        { tekst: "De HEERE is mijn Herder, mij zal niets ontbreken.", ref: "Psalm 23:1" },
        { tekst: "Uw woord is een lamp voor mijn voet en een licht op mijn pad.", ref: "Psalm 119:105" },
        { tekst: "Vertrouw op de HEERE met heel je hart, en steun op je eigen inzicht niet.", ref: "Spreuken 3:5" },
        { tekst: "Wees niet bevreesd, want Ik ben met u; wees niet ontsteld, want Ik ben uw God.", ref: "Jesaja 41:10" },
        { tekst: "De vreugde van de HEERE is uw kracht.", ref: "Nehemia 8:11" },
        { tekst: "Want alzo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft.", ref: "Johannes 3:16" },
        { tekst: "Ik vermag alle dingen door Christus, Die mij kracht geeft.", ref: "Filippenzen 4:13" },
        { tekst: "Wees in geen ding bezorgd, maar laat uw verlangens in alles door bidden en smeken bekend worden bij God.", ref: "Filippenzen 4:6" },
        { tekst: "De HEERE is mijn licht en mijn heil, voor wie zou ik vrezen?", ref: "Psalm 27:1" },
        { tekst: "Zo zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", ref: "Mattheüs 6:33" }
    ];

    function updateDagelijksWoord() {
        try {
            const nu = new Date();
            const start = new Date(nu.getFullYear(), 0, 0);
            const diff = nu - start;
            const eenDag = 1000 * 60 * 60 * 24;
            const dagVanHetJaar = Math.floor(diff / eenDag);
            
            const index = dagVanHetJaar % bijbelVerzen.length;
            const huidigVers = bijbelVerzen[index];

            const vText = document.getElementById('bibleVerseText');
            const vRef = document.getElementById('bibleVerseRef');

            if (vText) vText.innerText = `"${huidigVers.tekst}"`; if (vRef) vRef.innerText = huidigVers.ref; } catch(e) {} }  // --- KLOK LOGICA --- let activeAlarm = null;  function updateKlok() { try { const nu = new Date(); const seconden = nu.getSeconds(); const minuten = nu.getMinutes(); const uren = nu.getHours();  const secGraden = seconden * 6; const minGraden = minuten * 6 + seconden * 0.1; const uurGraden = (uren \% 12) * 30 + minuten * 0.5;  const hourHand = document.getElementById('hourHand'); const minuteHand = document.getElementById('minuteHand'); const secondHand = document.getElementById('secondHand');  if (hourHand) hourHand.style.transform = `rotate(${uurGraden}deg)`;
            if (minuteHand) minuteHand.style.transform = `rotate(${minGraden}deg)`; if (secondHand) secondHand.style.transform = `rotate(${secGraden}deg)`;

            const optiesDagen = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateElem = document.getElementById('digitalDate');
            if (dateElem) dateElem.innerText = nu.toLocaleDateString('nl-NL', optiesDagen);

            const timeElem = document.getElementById('digitalTime');
            if (timeElem) timeElem.innerText = String(uren).padStart(2, '0') + ':' + String(minuten).padStart(2, '0') + ':' + String(seconden).padStart(2, '0');

            if (activeAlarm) {
                const currentAlarmStr = String(uren).padStart(2, '0') + ':' + String(minuten).padStart(2, '0');
                if (activeAlarm === currentAlarmStr && seconden === 0) {
                    const statusElem = document.getElementById('alarmStatus');
                    if (statusElem) statusElem.innerText = `🔔 WEKKER GAAT AF!`;
                    playMusic();
                }
            }
        } catch(e) {}
    }
    
    setInterval(updateKlok, 1000);
    updateKlok();
    updateDagelijksWoord();

    // --- PLAYLIST & EXCEL OPSLAG MECHANISME ---
    let miniTvPlaylist = [
        "https://youtu.be/WTSLipAWHow",
        "https://youtu.be/v_sTi3mHYew"
    ];
    let huidigePlaylistIndex = 0;

    if (localStorage.getItem('menaMuriaPlaylist')) {
        try {
            miniTvPlaylist = JSON.parse(localStorage.getItem('menaMuriaPlaylist'));
        } catch(e) {}
    }

    if (localStorage.getItem('menaMuriaLastIndex')) {
        huidigePlaylistIndex = parseInt(localStorage.getItem('menaMuriaLastIndex')) || 0;
    }

    function vulExcelDropdown() {
        const select = document.getElementById('miniTvSelect');
        if (!select) return;
        select.innerHTML = '<option value="">📂 Kies uit je geladen favorieten...</option>';
        miniTvPlaylist.forEach((link, index) => {
            const opt = document.createElement('option');
            opt.value = link;
            opt.text = `Favoriet #${index + 1} (${link.substring(8, 35)}...)`;
            select.appendChild(opt);
        });
        if (miniTvPlaylist.length > 0 && huidigePlaylistIndex < miniTvPlaylist.length) {
            select.selectedIndex = huidigePlaylistIndex + 1;
            const urlInput = document.getElementById('miniTvUrl');
            if (urlInput) urlInput.value = miniTvPlaylist[huidigePlaylistIndex];
        }
    }
    vulExcelDropdown();

    function importeerExcelLijst() {
        const inputElem = document.getElementById('excelInput');
        if (!inputElem) return;
        const tekst = inputElem.value;
        if (!tekst.trim()) {
            alert("Plak eerst je lijst in het veld!");
            return;
        }

        const gevondenLinks = tekst.match(/https?:\/\/[^\s]+/g);

        if (gevondenLinks && gevondenLinks.length > 0) {
            miniTvPlaylist = gevondenLinks;
            localStorage.setItem('menaMuriaPlaylist', JSON.stringify(miniTvPlaylist));
            huidigePlaylistIndex = 0;
            localStorage.setItem('menaMuriaLastIndex', 0);
            vulExcelDropdown();
            alert(`Succes! Er zijn ${gevondenLinks.length} links opgeslagen in je app.`);
        } else {
            alert("Geen geldige links gevonden in de geplakte tekst.");
        }
    }

    function kiesExcelNummer() {
        const select = document.getElementById('miniTvSelect');
        const urlInput = document.getElementById('miniTvUrl');
        if (select && select.value && urlInput) {
            urlInput.value = select.value;
            huidigePlaylistIndex = select.selectedIndex - 1;
            localStorage.setItem('menaMuriaLastIndex', huidigePlaylistIndex);
            startMiniTV();
        }
    }

    function converteerYouTubeLink(url) {
        if (!url) return '';
        let videoId = '';
        if (url.includes('youtu.be/')) {
            videoId = url.split('youtu.be/')[1].split('?')[0].split('&')[0];
        } else if (url.includes('watch?v=')) {
            videoId = url.split('watch?v=').pop().split('&')[0];
        } else if (url.includes('/embed/')) {
            videoId = url.split('/embed/').pop().split('?')[0];
        }
        
        if (videoId) {
            return `https://www.youtube.com/embed/${videoId}`;
        }
        return url;
    }

    function volgendNummer() {
        if (miniTvPlaylist.length === 0) return;
        huidigePlaylistIndex = (huidigePlaylistIndex + 1) % miniTvPlaylist.length;
        localStorage.setItem('menaMuriaLastIndex', huidigePlaylistIndex);
        const urlInput = document.getElementById('miniTvUrl');
        if (urlInput) urlInput.value = miniTvPlaylist[huidigePlaylistIndex];
        const select = document.getElementById('miniTvSelect');
        if (select) select.selectedIndex = huidigePlaylistIndex + 1;
        startMiniTV();
    }

    function vorigNummer() {
        if (miniTvPlaylist.length === 0) return;
        huidigePlaylistIndex = (huidigePlaylistIndex - 1 + miniTvPlaylist.length) % miniTvPlaylist.length;
        localStorage.setItem('menaMuriaLastIndex', huidigePlaylistIndex);
        const urlInput = document.getElementById('miniTvUrl');
        if (urlInput) urlInput.value = miniTvPlaylist[huidigePlaylistIndex];
        const select = document.getElementById('miniTvSelect');
        if (select) select.selectedIndex = huidigePlaylistIndex + 1;
        startMiniTV();
    }

    // --- MUZIEK SPELER ---
    function kiesStation() {
        const select = document.getElementById('stationSelect');
        const streamUrl = document.getElementById('streamUrl');
        if (select && streamUrl) streamUrl.value = select.value;
    }

    function playMusic() {
        const iframe = document.getElementById('youtubePlayer');
        const container = document.getElementById('playerContainer');
        const urlInput = document.getElementById('streamUrl');
        if (!iframe || !container || !urlInput) return;
        
        let embedUrl = converteerYouTubeLink(urlInput.value);
        container.style.display = 'block';
        let playUrl = embedUrl.includes('?') ? embedUrl + '&autoplay=1' : embedUrl + '?autoplay=1';
        iframe.src = playUrl;
    }

    function stopMusic() {
        const iframe = document.getElementById('youtubePlayer');
        const container = document.getElementById('playerContainer');
        if (iframe) iframe.src = "";
        if (container) container.style.display = 'none';
    }

    // --- MINI TV LOGICA ---
    function toggleMiniTV() {
        const container = document.getElementById('miniTvContainer');
        const player = document.getElementById('miniTvPlayer');
        const videoElem = document.getElementById('miniTvVideo');
        if (!container) return;

        if (container.style.display === 'block') {
            container.style.display = 'none';
            if (player) player.src = "";
            if (videoElem) videoElem.pause();
        } else {
            container.style.display = 'block';
            if (miniTvPlaylist.length > 0) {
                const urlInput = document.getElementById('miniTvUrl');
                if (urlInput) urlInput.value = miniTvPlaylist[huidigePlaylistIndex];
                const select = document.getElementById('miniTvSelect');
                if (select) select.selectedIndex = huidigePlaylistIndex + 1;
            }
            startMiniTV();
        }
    }

    function startMiniTV() {
        const urlInput = document.getElementById('miniTvUrl');
        const iframe = document.getElementById('miniTvPlayer');
        const videoElement = document.getElementById('miniTvVideo');
        if (!urlInput || !iframe || !videoElement) return;

        let urlVal = urlInput.value.trim();

        if (urlVal.includes('onedrive.live.com') || urlVal.includes('.mp4')) {
            iframe.style.display = 'none';
            iframe.src = "";
            videoElement.style.display = 'block';
            
            let directUrl = urlVal;
            if (directUrl.includes('onedrive.live.com') && !directUrl.includes('download=1')) {
                directUrl += (directUrl.includes('?') ? '&' : '?') + 'download=1';
            }
            
            videoElement.src = directUrl;
            videoElement.play().catch(e => console.log("Autoplay vereist interactie"));
        } else {
            videoElement.style.display = 'none';
            videoElement.pause();
            videoElement.src = "";
            
            iframe.style.display = 'block';
            let embedUrl = converteerYouTubeLink(urlVal);
            let playUrl = embedUrl.includes('?') ? embedUrl + '&autoplay=1' : embedUrl + '?autoplay=1';
            iframe.src = playUrl;
        }
    }

    // --- WEKKER FUNCTIE ---
    function zetWekker() {
        const tijdElem = document.getElementById('alarmTijd');
        const statusElem = document.getElementById('alarmStatus');
        if (!tijdElem || !statusElem) return;

        const tijd = tijdElem.value;
        if(tijd) {
            activeAlarm = tijd;
            statusElem.innerText = `Wekker ingesteld om ${tijd} uur`;
        } else {
            activeAlarm = null;
            statusElem.innerText = `Geen wekker ingesteld`;
        }
    }

    let kalenderNotities = {};
    if (localStorage.getItem('menaMuriaKalenderNotities')) {
        try {
            kalenderNotities = JSON.parse(localStorage.getItem('menaMuriaKalenderNotities'));
        } catch(e) {}
    }

    let geselecteerdeSleutel = null;

        const maandSelect = document.getElementById('maandSelect');

        grid.innerHTML = '';

        dNamen.forEach(d => {
            const div = document.createElement('div');
            div.className = 'calendar-day-name';
            div.innerText = d;
            grid.appendChild(div);
        });

        eersteDagIndex = (eersteDagIndex === 0) ? 6 : eersteDagIndex - 1;

        for (let i = 0; i < eersteDagIndex; i++) {

            leeg.className = 'calendar-cell empty';
            grid.appendChild(leeg);
        }

        const vandaag = new Date();
        let meldingenVandaag = [];

        for (let dag = 1; dag <= aantalDagen; dag++) {
            const cel = document.createElement('div');
            cel.className = 'calendar-cell';
            
            const sleutel = `${jaar}-${maand}-${dag}`;
            let heeftNotitie = kalenderNotities[sleutel] ? true : false;

            cel.innerHTML = `<span>${dag}</span>${heeftNotitie ? '<span style="font-size:0.6rem; color:#ffcc00;">⭐</span>' : ''}`;

            if (heeftNotitie) {
                cel.classList.add('has-note');
                cel.title = kalenderNotities[sleutel];
            }

            if (dag === vandaag.getDate() && maand === vandaag.getMonth() && jaar === vandaag.getFullYear()) {
                cel.classList.add('today');
            }

            if (sleutel === geselecteerdeSleutel) {
                cel.classList.add('selected');
            }

            cel.onclick = function() {
                geselecteerdeSleutel = sleutel;
                const maandNaam = maandSelect.options[maand].text;
                document.getElementById('geselecteerdeDatumTitel').innerText = `Geselecteerde dag: ${dag} ${maandNaam}${jaar}`;
                document.getElementById('dagNotitieInput').value = kalenderNotities[sleutel] || '';
                bouwKalender();
            };

            if (dag === vandaag.getDate() && maand === vandaag.getMonth() && jaar === vandaag.getFullYear() && heeftNotitie) {
                meldingenVandaag.push(kalenderNotities[sleutel]);
            }

            grid.appendChild(cel);
        }

        if (meldingDiv) {
            if (meldingenVandaag.length > 0) {
                const opgemaakteTekst = meldingenVandaag.join('\n\n');
                meldingDiv.innerText = `🔔
