<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena Muria Klok & Radio</title>
    <style>
        :root {
            --bg-color: #0d0b07;
            --card-bg: #14110b;
            --border-gold: #d4af37;
            --text-gold: #e6ca65;
            --text-light: #f4edd3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 2px solid var(--border-gold);
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        header h1 {
            color: var(--text-gold);
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        header p {
            font-size: 0.75rem;
            color: var(--text-light);
            margin: 0 0 15px 0;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .section {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        /* KLOK STYLING MET JOUW CLOCK-FACE.PNG */
        .clock-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-face {
            width: 260px;
            height: 260px;
            background-image: url('clock-face.png');
            background-size: cover;
            background-position: center;
            border: 4px solid var(--border-gold);
            border-radius: 50%;
            position: relative;
            margin: 10px auto;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .clock-center-dot {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, #fff 0%, var(--border-gold) 100%);
            border: 1px solid #000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* WATERPAS WIJZERS MET KROONPIJLTJES */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg);
            z-index: 5;
        }

        .hour-hand {
            width: 14px;
            height: 75px;
        }

        .minute-hand {
            width: 12px;
            height: 100px;
        }

        .second-hand {
            width: 2px;
            height: 110px;
            background-color: #ff4d4d;
            z-index: 6;
            transform-origin: bottom center;
        }

        .digital-date {
            font-size: 0.9rem;
            color: var(--text-gold);
            margin-top: 5px;
        }

        .digital-time {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        /* KNOPPEN EN INPUTS */
        select, button, input {
            background: linear-gradient(to bottom, #d4af37, #aa8c2c);
            color: #0d0b07;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            margin: 4px 0;
            width: 100%;
            box-sizing: border-box;
        }

        select {
            background: #1f1910;
            color: var(--text-gold);
            border: 1px solid var(--border-gold);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        /* EEUWKALENDER STYLING */
        .calendar-header {
            font-size: 0.9rem;
            color: var(--text-gold);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .week-days {
            display: flex;
            justify-content: space-around;
            font-size: 0.75rem;
            color: var(--text-gold);
            font-weight: bold;
            margin-top: 8px;
            border-bottom: 1px dashed rgba(212,175,55,0.4);
            padding-bottom: 4px;
        }

        .calendar-status {
            font-size: 0.75rem;
            font-style: italic;
            opacity: 0.8;
            margin-top: 8px;
        }

        iframe {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>MENA MURIA</h1>
        <p>KLOK • RADIO STREAM • EEUWKALENDER</p>
    </header>

    <!-- KLOK SECTIE -->
    <div class="section clock-section">
        <div class="clock-face" id="klokFace">
            <div class="clock-center-dot"></div>
            <!-- Uurwijzer met Kroonpijltje -->
            <div class="hand hour-hand" id="hourHand">
                <svg viewBox="0 0 20 100" width="100%" height="100%">
                    <path d="M10 0 L18 18 L13 18 L13 100 L7 100 L7 18 L2 18 Z" fill="#e6ca65" stroke="#0d0b07" stroke-width="1.5"/>
                </svg>
            </div>
            <!-- Minuutwijzer met Kroonpijltje -->
            <div class="hand minute-hand" id="minuteHand">
                <svg viewBox="0 0 16 100" width="100%" height="100%">
                    <path d="M8 0 L15 14 L11 14 L11 100 L5 100 L5 14 L1 14 Z" fill="#f4edd3" stroke="#0d0b07" stroke-width="1.5"/>
                </svg>
            </div>
            <!-- Secondewijzer -->
            <div class="hand second-hand" id="secondHand"></div>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-gold); margin-top: 4px; font-weight: bold;">ABORU</div>
        <div class="digital-date" id="digitalDate">woensdag 21 oktober 2026</div>
        <div class="digital-time" id="digitalTime">01:43:00</div>
    </div>

    <!-- DAGELIJKS WOORD -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 4px;">📖 DAGELIJKS WOORD</div>
        <div style="font-size: 0.85rem; font-style: italic;">"De Heer is mijn herder, mij ontbreekt niets."</div>
        <div style="font-size: 0.7rem; opacity: 0.7; margin-top: 4px;">Psalm 23:1</div>
    </div>

    <!-- STREAM & RADIO SPELER -->
    <div class="section">
        <div style="font-size: 0.75rem; color: var(--text-gold); margin-bottom: 6px;">📻 STREAM & RADIO SPELER</div>
        <select id="stationSelect">
            <option>Carlos Santana (Wekker Concert)</option>
        </select>
        <input type="text" id="streamUrl" value="https://www.youtube.com/embed/Q6W78dSEa1M" style="background:#1f1910; color:var(--text-gold); border:1px solid var(--border-gold); font-size:0.75rem; margin-top:6px;">
        <div class="btn-row" style="margin-top: 8px;">
            <button onclick="playMusic()">▶ Play</button>
            <button onclick="stopMusic()" style="background: linear-gradient(to bottom, #d9534f, #c9302c); color: white;">⏹ Stop</button>
        </div>
        <div id="playerContainer">
            <iframe id="youtubePlayer" width="100%" height="80" src="" frameborder="0" allow="autoplay"></iframe>
        </div>
    </div>

    <!-- EEUWKALENDER -->
    <div class="section">
        <div class="calendar-header">📅 EEUWKALENDER</div>
        <button onclick="gaNaarVandaag()">Vandaag</button>
        <div class="btn-row" style="margin-top: 6px;">
            <select id="maandSelect">
                <option value="0">Januari</option>
                <option value="1">Februari</option>
                <option value="2">Maart</option>
                <option value="3">April</option>
                <option value="4">Mei</option>
                <option value="5">Juni</option>
                <option value="6">Juli</option>
                <option value="7">Augustus</option>
                <option value="8">September</option>
                <option value="9" selected>Oktober</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>
            <input type="number" id="jaarInput" value="2026" style="width: 80px; text-align: center;">
        </div>
        <button onclick="laadKalender()" style="margin-top: 6px;">Ga naar jaar</button>
        
        <div class="week-days">
            <span>Ma</span><span>Di</span><span>Wo</span><span>Do</span><span>Vr</span><span>Za</span><span>Zo</span>
        </div>
        <div class="calendar-status" id="kalenderStatus">Geselecteerde datum: 21 oktober 2026</div>
    </div>
</div>

<script>
    // --- KLOK LOGICA ---
    function updateKlok() {
        const nu = new Date();
        const seconden = nu.getSeconds();
        const minuten = nu.getMinutes();
        const uren = nu.getHours();

        const secGraden = seconden * 6;
        const minGraden = minuten * 6 + seconden * 0.1;
        const uurGraden = (uren % 12) * 30 + minuten * 0.5;

        document.getElementById('secondHand').style.transform = `translateX(-50%) rotate(${secGraden}deg)`;
        document.getElementById('minuteHand').style.transform = `translateX(-50%) rotate(${minGraden}deg)`;
        document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${uurGraden}deg)`;

        const optiesDagen = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('digitalDate').innerText = nu.toLocaleDateString('nl-NL', optiesDagen);
        document.getElementById('digitalTime').innerText = nu.toLocaleTimeString('nl-NL');
    }
    setInterval(updateKlok, 1000);
    updateKlok();

    // --- MUZIEK SPELER ---
    function playMusic() {
        const iframe = document.getElementById('youtubePlayer');
        const urlInput = document.getElementById('streamUrl').value;
        iframe.style.display = 'block';
        let playUrl = urlInput.includes('?') ? urlInput + '&autoplay=1' : urlInput + '?autoplay=1';
        iframe.src = playUrl;
    }

    function stopMusic() {
        const iframe = document.getElementById('youtubePlayer');
        iframe.src = "";
        iframe.style.display = 'none';
    }

    // --- EEUWKALENDER ACTIE ---
    function laadKalender() {
        const maanden = ["Januari", "Februari", "Maart", "April", "Mei", "Juni", "Juli", "Augustus", "September", "Oktober", "November", "December"];
        const maandIdx = document.getElementById('maandSelect').value;
        const jaar = document.getElementById('jaarInput').value;
        document.getElementById('kalenderStatus').innerText = `Geselecteerde datum: 1 ${maanden[maandIdx]} ${jaar}`;
    }

    function gaNaarVandaag() {
        const vandaag = new Date();
        document.getElementById('maandSelect').value = vandaag.getMonth();
        document.getElementById('jaarInput').value = vandaag.getFullYear();
        laadKalender();
    }
</script>

</body>
</html>
