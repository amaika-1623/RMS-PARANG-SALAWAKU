<html lang="nl">

        body {
            background-color: #0b0804;
            color: #d4af37;
            font-family: 'Times New Roman', serif, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 15px;
            background: #110d06;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        h1 {
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #f3e5ab;
        }
        .subtitle {
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #c5a059;
        }
        .section-box {
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            background: #0f0a05;
        }
        .section-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* RONDE KLOK */
        .clock-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 10px auto;
            border-radius: 50%;
            overflow: hidden;
            background-image: url('clock-face.png?v=10');
            background-size: cover;
            background-position: center 47%;
            background-repeat: no-repeat;
            border: none;
            box-shadow: none;
        }

        /* ABORU TEKST ONDER DE KLOK */
        .aboru-title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #f3e5ab;
            margin-top: 8px;
            margin-bottom: 4px;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }

        /* WIJZERS MET KROONPIJL STIJL & GROENE SECONDEWIJZER */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            z-index: 10;
            filter: drop-shadow(0px 3px 5px rgba(0,0,0,0.9));
        }
        .hour-hand { 
            width: 10px; 
            height: 62px; 
            background: linear-gradient(135deg, #fff3cd 0%, #d4af37 50%, #aa820a 100%); 
            margin-left: -5px; 
            clip-path: polygon(50% 0%, 100% 25%, 70% 100%, 30% 100%, 0% 25%);
        }
        .minute-hand { 
            width: 7px; 
            height: 98px; 
            background: linear-gradient(135deg, #f3e5ab 0%, #d4af37 50%, #8b6914 100%); 
            margin-left: -3.5px; 
            clip-path: polygon(50% 0%, 100% 20%, 75% 100%, 25% 100%, 0% 20%);
        }
        .second-hand { 
            width: 2px; 
            height: 108px; 
            background: #00cc44; 
            margin-left: -1px; 
            z-index: 11; 
        }
        .center-dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            background: radial-gradient(circle, #ffcc00 0%, #8b0000 100%);
            border: 2px solid #d4af37;
            border-radius: 50%;
            margin: -6px 0 0 -6px;
            z-index: 12;
        }

        /* DIGITALE TIJD & DATUM */
        .digital-time-section {
            margin-top: 8px;
            padding: 5px;
            border-top: 1px dashed rgba(212, 175, 55, 0.3);
        }
        .date-line {
            font-size: 13px;
            color: #c5a059;
            margin-bottom: 4px;
            margin-top: 5px;
        }
        .time-line {
            font-size: 28px;
            font-weight: bold;
            color: #f3e5ab;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* BIJBELTEKST */
        .bible-verse {
            font-style: italic;
            font-size: 13px;
            color: #f3e5ab;
            line-height: 1.4;
            padding: 8px 5px;
            min-height: 40px;
        }
