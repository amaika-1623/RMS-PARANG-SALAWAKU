<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena Muria Klok & Eeuwkalender</title>
    <style>
        body {
            background-color: #0b0804;
            color: #d4af37;
            font-family: 'Times New Roman', serif, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 15px;
            background: #110d06;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        h1 {
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #f3e5ab;
        }
        .subtitle {
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 15px;
            color: #c5a059;
        }
        .section-box {
            border: 1px solid #d4af37;
            border-radius: 8px;
            padding: 10px;
            margin-top: 15px;
            background: #0f0a05;
        }
        .section-title {
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        /* PERFECTE RONDE KLOK - Plaatje op center 58% */
        .clock-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 10px auto;
            border-radius: 50%;
            overflow: hidden;
            background-image: url('clock-face.png');
            background-size: 94%;
            background-position: center 58%;
            background-repeat: no-repeat;
            border: 2px solid #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* WIJZERS */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px;
            z-index: 10;
        }
        .hour-hand { 
            width: 8px; 
            height: 52px; 
            background: #fff3cd; 
            margin-left: -4px; 
            box-shadow: 0 0 6px rgba(0,0,0,0.9);
        }
        .minute-hand { 
            width: 4px; 
            height: 94px; 
            background: #d4af37; 
            margin-left: -2px; 
            box-shadow: 0 0 6px rgba(0,0,0,0.9);
        }
        .second-hand { 
            width: 1.5px; 
            height: 100px; 
            background: #ff3333; 
            margin-left: -0.75px; 
            z-index: 11; 
        }
        .center-dot {
            position: absolute;
            top: 50%; left: 50%;
            width: 12px; height: 12px;
            background: radial-gradient(circle, #ffcc00 0%, #8b0000 100%);
            border: 2px solid #d4af37;
            border-radius: 50%;
            margin: -6px 0 0 -6px;
            z-index: 12;
        }

        /* DIGITALE TIJD & DATUM */
        .digital-time-section {
            margin-top: 12px;
            padding: 5px;
            border-top: 1px dashed rgba(212, 175, 55, 0.3);
        }
        .aboru-title {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #d4af37;
            margin-bottom: 4px;
            text-shadow: 1px 1px 3px #000;
        }
        .date-line {
            font-size: 13px;
            color: #c5a059;
            margin-bottom: 4px;
        }
        .time-line {
            font-size: 28px;
            font-weight: bold;
            color: #f3e5ab;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        /* BIJBELTEKST */
        .bible-verse {
            font-style: italic;
            font-size: 13px;
            color: #f3e5ab;
            line-height: 1.4;
            padding: 8px 5px;
            min-height: 40px;
        }
        .bible-ref {
            font-size: 11px;
            font-weight: bold;
            color: #d4af37;
            margin-top: 4px;
            font-style: normal;
        }

        /* UI ELEMENTS */
        select, input[type="text"], input[type="number"], input[type="time"], button, .link-button {
            background-color: #1a1205;
            color: #f3e5ab;
            border: 1px solid #d4af37;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            margin: 4px 0;
            box-sizing: border-box;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        select, input[type="text"], input[type="time"] { width: 100%; }
        button, .link-button {
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(to bottom, #d4af37, #aa820a);
            color: #0b0804;
        }
        button:hover, .link-button:hover { opacity: 0.9; }

        iframe {
            border-radius: 6px;
            border: 1px solid #d4af37;
            width: 100%;
            height: 200px;
        }
        .status-text {
            font-size: 11px;
            font-style: italic;
            margin-top: 5px;
            color: #c5a059;
        }
        table {
            width: 100%;
            margin-top: 10px;
            border-collapse: collapse;
        }
        th, td {
            padding: 5px;
            font-size: 12px;
            text-align: center;
        }
        th { color: #f3e5ab; }
        td.today-cell {
            background: #d4af37;
            color: #0b0804;
            font-weight: bold;
            border-radius: 50%;
        }

        #tvPlayerContainer {
            display: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MENA MURIA</h1>
    <div class="subtitle">KLOK • RADIO STREAM • EEUWKALENDER</div>

    <!-- KLOK & DIGITALE TIJD -->
    <div class="section-box">
        <div class="clock-container">
            <div class="hand hour-hand" id="hourHand"></div>
            <div class="hand minute-hand" id="minuteHand"></div>
            <div class="hand second-hand" id="secondHand"></div>
            <div class="center-dot"></div>
        </div>

        <div class="digital-time-section">
            <div class="aboru-title">ABORU</div>
            <div class="date-line" id="digitalDateOnly">Laden...</div>
            <div class="time-line" id="digitalTimeOnly">00:00:00</div>
        </div>
    </div>

    <!-- DAGELIJKS WOORD -->
    <div class="section-box">
        <div class="section-title">📖 DAGELIJKS WOORD</div>
        <div class="bible-verse" id="bibleVerseText">Laden van dagtekst...</div>
        <div class="bible-ref" id="bibleVerseRef"></div>
    </div>

    <!-- STREAM & RADIO SPELER -->
    <div class="section-box">
        <div class="section-title">📻 STREAM & RADIO SPELER</div>
        
        <select id="stationSelect">
            <option value="https://youtu.be/Q6W78dSEa1M">Carlos Santana (Wekker Concert)</option>
            <option value="https://youtu.be/4y9szAi9Dhc">Edwine Samuels (Herfstparty)</option>
            <option value="https://icecast.omroep.nl/radio1-bb-mp3">NPO Radio 1 (Audio)</option>
            <option value="https://icecast.omroep.nl/radio2-bb-mp3">NPO Radio 2 (Audio)</option>
            <option value="https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO_10.mp3">Radio 10 (Audio)</option>
        </select>

        <input type="text" id="mediaUrl" value="https://youtu.be/Q6W78dSEa1M" placeholder="Plak YouTube of Stream URL..." />
        
        <div style="display: flex; gap: 5px;">
            <button id="playBtn" style="flex: 1;">▶ Play</button>
            <button id="stopBtn" style="flex: 1;">⏹ Stop</button>
        </div>

        <div style="margin-top: 6px;">
            <a href="https://nl.radio.net/" target="_blank" class="link-button" style="width: 100%;">🌐 Radio.net (Alle Zenders)</a>
        </div>

        <div id="mediaOutput">
            <div class="status-text" id="playerStatus">Speler gereed</div>
