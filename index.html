<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mena Muria Klok & Radio</title>
    <style>
        :root {
            --bg-color: #0d0b07;
            --card-bg: #14110b;
            --border-gold: #d4af37;
            --text-gold: #e6ca65;
            --text-light: #f4edd3;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border: 2px solid var(--border-gold);
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }

        header h1 {
            color: var(--text-gold);
            font-size: 1.5rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
        }

        header p {
            font-size: 0.75rem;
            color: var(--text-light);
            margin: 0 0 15px 0;
            opacity: 0.8;
            letter-spacing: 1px;
        }

        .section {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        /* KLOK SECTIE */
        .clock-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-face {
            width: 230px;
            height: 230px;
            position: relative;
            margin: 10px auto;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* VASTE ACHTERGROND AFBEELDING */
        .clock-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .clock-center-dot {
            width: 10px;
            height: 10px;
            background: #cbd5e1;
            border: 1px solid #334155;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        /* WIJZERS: EXACT GECENTREERD OP HET MIDDELPUNT */
        .hand {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: 50% 100%; /* Draaipunt exact onderaan in het midden van de wijzer */
            transform: translate(-50%, -100%) rotate(0deg);
            z-index: 5;
        }

        .hour-hand {
            width: 13px;
            height: 62px;
        }

        .minute-hand {
            width: 11px;
            height: 84px;
        }

        .second-hand {
            width: 2px;
            height: 94px;
            background-color: #00ff66;
            z-index: 6;
            transform-origin: 50% 100%;
        }

        .digital-date {
            font-size: 0.9rem;
            color: var(--text-gold);
            margin-top: 5px;
        }

        .digital-time {
            font-size: 1.4rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        /* KNOPPEN EN INPUTS */
        select, button, input {
            background: linear-gradient(to bottom, #d4af37, #aa8c2c);
            color: #0d0b07;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            margin: 4px 0;
            width: 100%;
            box-sizing: border-box;
        }

        select {
            background: #1f1910;
            color: var(--text-gold);
            border: 1px solid var(--border-gold);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        /* EEUWKALENDER GRID */
        .calendar-header {
            font-size: 0.9rem;
            color: var(--text-gold);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            font-size: 0.75rem;
            margin-top: 8px;
        }

        .calendar-day-name {
            color: var(--text-gold);
            font-weight: bold;
            padding: 4px 0;
        }

        .calendar-cell {
            background: rgba(255,255,255,0.05);
            padding: 6px 0;
            border-radius: 3px;
            color: var(--text-light);
        }

        .calendar-cell.empty {
            background: transparent;
        }

        .calendar-cell.today {
            background: var(--border-gold);
            color: #0d0b07;
            font-weight: bold;
        }

        .media-frame {
            display: none;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>MENA MURIA</h1>
        <p>KLOK • RADIO STREAM • EEUWKALENDER</p>
    </header>

    <!-- KLOK SECTIE -->
    <div class="section clock-section">
        <div class="clock-face" id="klokFace">
            <img src="clock-face.png" alt="Klok Wijzerplaat" class="clock-bg-img">
            <div class="clock-center-dot"></div>
            
            <!-- Uurwijzer -->
            <div class="hand hour-hand" id="hourHand">
